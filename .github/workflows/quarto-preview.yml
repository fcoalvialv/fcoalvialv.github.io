name: Quarto preview build

on:
  workflow_dispatch:
  push:
    branches:
      - quarto-migration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Upload rendered website
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site-preview
          path: _site
          retention-days: 14

# This workflow validates the migration branch without publishing the public site.
